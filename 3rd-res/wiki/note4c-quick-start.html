<blockquote>
<p><strong>硬件适用范围：</strong> 本指南仅适用于四色屏 <strong>ZECTRIX NOTE4C 开发套件</strong>（PCB 版本 <strong>1.0</strong>）：ESP32-S3 N16R8，配备 4.2 英寸 400 × 300 黑、白、红、黄四色电子墨水屏。除显示面板及其刷新行为外，NOTE4C 与黑白屏 NOTE4 开发套件使用相同的控制板、按键、音频、电源系统、USB 接口和外壳。两者的显示固件镜像不可混用。</p>
</blockquote>
<img src="/note4c-devkit-controls-ports-en.png" alt="ZECTRIX NOTE4C 开发套件按键与接口" width="760" height="740" style="display:block;width:100%;max-width:760px;height:auto;aspect-ratio:38/37;">
<h2 id="产品说明" class="toc-header"><a class="toc-anchor" href="#产品说明">¶</a> 产品说明</h2>
<p>ZECTRIX NOTE4C 开发套件是一款组装完成的 ESP32-S3 四色电子墨水屏开发平台，适用于低功耗信息显示、电子标签、照片卡片、状态面板和自定义嵌入式项目。设备在一个成品中集成了显示屏、控制板、可充电电池、麦克风、扬声器、RTC、NFC、实体按键、USB Type-C、磁吸背板和外壳。</p>
<p>NOTE4C 是开放式开发设备，不包含开箱即用的消费版 NOTE4 固件、官方 NOTE4 AI 语音任务体验或 NOTE4 云服务。公开参考固件提供基础 Wi-Fi 配置、图片传输、四色屏测试和二次开发能力。</p>

<h2 id="重要说明" class="toc-header"><a class="toc-anchor" href="#重要说明">¶</a> 重要说明</h2>
<ul>
<li>刷写前请确认设备是四色屏 NOTE4C，绝不要向 NOTE4C 安装黑白屏 NOTE4 固件镜像。</li>
<li>PCB 版本 1.0 包含 NFC。未来的国际消费量产版可能取消 NFC，购买前请向 ZECTRIX 客服确认 NFC 配置。</li>
<li>安装第三方固件或更改分区表前，请完整备份 16 MB 原厂 Flash。</li>
<li>请使用支持数据传输的 USB 线。仅支持充电的线缆可以为设备供电，但不会显示串口。</li>
<li>四色屏全屏刷新通常需要 10 秒以上。刷新过程中的闪烁、短暂颜色反转或可见色粉移动均属正常现象。</li>
<li>电子墨水屏无需持续供电也会保留最后一幅画面。屏幕上有画面并不表示设备仍在运行。</li>
<li>本指南后文描述的是预编译参考固件的按键行为。其他固件项目可以为相同硬件输入定义不同的应用行为。</li>
</ul>
<h2 id="主要特性" class="toc-header"><a class="toc-anchor" href="#主要特性">¶</a> 主要特性</h2>
<ul>
<li>ESP32-S3 N16R8，16 MB Flash、8 MB PSRAM</li>
<li>4.2 英寸 400 × 300 黑、白、红、黄四色电子墨水屏</li>
<li>SSD2683 显示控制器和 2 bpp BWRY 输出</li>
<li>2.4 GHz Wi-Fi 与 Bluetooth LE 5.0</li>
<li>集成麦克风、扬声器、ES8311 音频编解码器、PCF8563 RTC、NFC 和状态 LED</li>
<li>三个实体用户按键及一个内凹 RESET 针孔</li>
<li>USB Type-C 供电、原生 USB 数据、固件刷写与串口监视</li>
<li>2,000+ mAh 可充电电池</li>
</ul>
<h2 id="包装内容" class="toc-header"><a class="toc-anchor" href="#包装内容">¶</a> 包装内容</h2>
<ul>
<li>1 × ZECTRIX NOTE4C 开发套件</li>
<li>1 × 桌面支架</li>
<li>已组装的四色显示屏、控制板、电池、外壳、按键和磁吸背板</li>
<li>在线参考固件、源码和开发资料</li>
</ul>
<h2 id="典型应用" class="toc-header"><a class="toc-anchor" href="#典型应用">¶</a> 典型应用</h2>
<ul>
<li>四色天气、日历、任务和状态看板</li>
<li>电子标签和低频更新信息面板</li>
<li>电子墨水照片卡片和画廊显示</li>
<li>支持语音的 ESP32-S3 交互界面</li>
<li>NFC 触发工作流和智能标签</li>
<li>四色屏驱动、电源管理和嵌入式 UI 开发</li>
<li>家庭自动化面板和自定义 IoT 终端</li>
</ul>

<h2 id="电源与复位" class="toc-header"><a class="toc-anchor" href="#电源与复位">¶</a> 电源与复位</h2>
<p>GPIO17 控制主板的电源保持电路。使用电池运行的固件必须在启动后维持所需的电源锁存状态。GPIO18 同时连接到下键 / 电源键，因此开机、关机和长按行为取决于所安装的固件。</p>
<p>左侧内凹针孔是硬件 RESET 输入，连接 ESP32-S3 的 EN / RST 信号，不会清除固件或用户数据。</p>
<h2 id="进入-esp32-s3-下载模式" class="toc-header"><a class="toc-anchor" href="#进入-esp32-s3-下载模式">¶</a> 进入 ESP32-S3 下载模式</h2>
<p>大多数电脑无需按键即可连接 NOTE4C 开发套件。如果浏览器更新工具或 <code>esptool</code> 无法识别设备：</p>
<ol>
<li>保持 USB Type-C 数据线连接。</li>
<li>按住正面的圆形 <strong>BOOT / 确认</strong> 按键（GPIO0）。</li>
<li>保持 BOOT 按下，同时短按一次左侧内凹 <strong>RESET</strong> 针孔。</li>
<li>松开 BOOT。</li>
<li>重新连接，并选择新出现的 ESP32-S3 串口设备。</li>
</ol>
<p>以上操作会让 ESP32-S3 手动进入 ROM 下载模式。正常重启后设备会恢复常规运行。</p>

<h3 id="推荐zectrix-浏览器固件更新工具" class="toc-header"><a class="toc-anchor" href="#推荐zectrix-浏览器固件更新工具">¶</a> 推荐：ZECTRIX 浏览器固件更新工具</h3>
<p><a href="https://zectrix.com/en/firmware-updater.html" class="is-external-link">ZECTRIX 浏览器固件更新工具</a>通过 USB 直连安装本地 <code>.bin</code> 文件。浏览器只在本地读取固件文件，不会将其上传到 ZECTRIX。</p>
<ol>
<li>在桌面版 Chrome 或 Edge 中打开更新工具。Safari 和 Firefox 不提供所需的 Web Serial 连接能力。</li>
<li>使用 USB 数据线将 NOTE4C 开发套件直接连接到电脑。</li>
<li>点击 <strong>连接设备</strong>，选择 ZECTRIX / ESP32-S3 USB 串口设备。</li>
<li>选择已经下载的合并 <code>.bin</code> 固件文件。</li>
<li>选择是否保留设备设置。推荐选项会备份设置分区，并在安装后恢复；需要全新配置时再取消该选项。</li>
<li>核对固件文件名，并确认写入地址为 <code>0x0000</code>。</li>
<li>点击 <strong>安装固件</strong>，在安装完成前保持数据线连接。</li>
<li>允许更新工具重启设备。如有需要，可在安装结果出现后使用 <strong>再次重启</strong>。</li>
</ol>
<p>如果设备无法连接，请按上文的 BOOT / RESET 顺序进入下载模式，然后再次点击 <strong>连接设备</strong>。</p>
<h3 id="备选esptool" class="toc-header"><a class="toc-anchor" href="#备选esptool">¶</a> 备选：esptool</h3>
<p>安装或更新 <code>esptool</code>：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">python3 -m pip install --upgrade esptool
</code></pre>
<p>在固件文件所在目录中执行：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">python3 -m esptool \
  --chip esp32s3 \
  --port /dev/cu.usbmodemXXXX \
  --baud 460800 \
  write-flash 0x0 notellm-2bp-v6.5.9-2bp-3fbbabb-20260705-mergebin.bin
</code></pre>
<p>请将串口名称替换为电脑实际识别到的设备端口。Windows 使用对应的 <code>COM</code> 端口，并在需要时将 <code>python3</code> 改为 <code>python</code>。合并镜像必须写入 <code>0x0</code>。</p>
<h2 id="使用预编译参考固件" class="toc-header"><a class="toc-anchor" href="#使用预编译参考固件">¶</a> 使用预编译参考固件</h2>
<p>本节行为适用于上文列出的可直接刷写镜像。自行编译的固件或仓库后续版本可能会有不同表现。</p>
<h3 id="按键操作" class="toc-header"><a class="toc-anchor" href="#按键操作">¶</a> 按键操作</h3>
<ul>
<li>短按上键：上一项或上一页。</li>
<li>短按下键：下一项或下一页。</li>
<li>短按 BOOT：确认。</li>
<li>双击上键：打开快速页面切换。</li>
<li>长按下键约 1 秒：打开“设置”。</li>
<li>同时长按上键和下键约 1 秒：进入 Wi-Fi 配网。</li>
<li>在“相册”页长按 BOOT：进入热点传图模式。</li>
<li>在热点传图页长按 BOOT：退出传图模式。</li>
<li>深度休眠后按 BOOT：唤醒设备。</li>
</ul>
<p>每次四色屏刷新完成后再按下一个按键。</p>
<h3 id="首次配置-wi-fi" class="toc-header"><a class="toc-anchor" href="#首次配置-wi-fi">¶</a> 首次配置 Wi-Fi</h3>
<p>设备没有保存过网络时，固件通常会自动进入配网模式。如果没有自动进入：</p>
<ol>
<li>同时长按上键和下键约 1 秒。</li>
<li>等待屏幕显示 Wi-Fi 配网。</li>
<li>用手机连接名称以 <code>ZecTrix</code> 开头的开放热点。</li>
<li>如果配网页面没有自动打开，请访问 <code>http://192.168.4.1</code>。</li>
<li>选择 2.4 GHz Wi-Fi，输入密码并保存。</li>
</ol>
<p>ESP32-S3 无法连接仅提供 5 GHz Wi-Fi 的网络。如果配网成功后“相册”页仍显示旧的连接状态，请短按一次 RESET，或先切换到其他页面再返回。</p>
<h3 id="使用手机上传四色图片" class="toc-header"><a class="toc-anchor" href="#使用手机上传四色图片">¶</a> 使用手机上传四色图片</h3>
<ol>
<li>使用上键和下键进入“相册”。</li>
<li>长按 BOOT，进入热点传图模式。</li>
<li>手机连接：</li>
</ol>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-text">热点：InkScreen-AP
密码：12345678
</code></pre>
<ol start="4">
<li>在手机浏览器中打开 <code>http://192.168.4.1</code>。</li>
<li>选择 <strong>2 BP 四色</strong> 转换模式。</li>
<li>选择 JPG、PNG 或其他受支持的图片，并检查 400 × 300 预览。</li>
<li>发送图片；如需立即显示，再选择“展示”。</li>
</ol>
<p>浏览器会缩放图片并将其转换为黑、白、红、黄四色，无需另行转换为 BIN。</p>
<p>请勿混淆两个热点：</p>
<ul>
<li><code>ZecTrix...</code>：首次配置家庭 Wi-Fi；默认无密码。</li>
<li><code>InkScreen-AP</code>：“相册”热点传图；密码为 <code>12345678</code>。</li>
</ul>
<h3 id="通过局域网上传图片" class="toc-header"><a class="toc-anchor" href="#通过局域网上传图片">¶</a> 通过局域网上传图片</h3>
<p>NOTE4C 连接家庭网络后：</p>
<ol>
<li>在设备上打开“设置”。</li>
<li>开启局域网服务。</li>
<li>记下屏幕上显示的 IP 地址。</li>
<li>在同一网络中的手机或电脑上打开 <code>http://设备IP/</code>，将“设备IP”替换为屏幕显示的地址。</li>
</ol>
<p>局域网页面支持上传图片、预览四色转换、显示和管理图片，以及设置轮播。DHCP 地址可能发生变化，请以设备当前显示的地址为准。</p>
<h2 id="软件开发" class="toc-header"><a class="toc-anchor" href="#软件开发">¶</a> 软件开发</h2>
<h3 id="开源项目" class="toc-header"><a class="toc-anchor" href="#开源项目">¶</a> 开源项目</h3>
<p>公开仓库 <a href="https://github.com/LazyYoun/youn-ink-fourcolor-firmware" class="is-external-link">LazyYoun/youn-ink-fourcolor-firmware</a> 使用 <code>2bp</code> 作为默认分支，采用 MIT 许可证。仓库包含 ESP-IDF 固件，以及可选的服务器和管理组件。</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">git clone https://github.com/LazyYoun/youn-ink-fourcolor-firmware.git
cd youn-ink-fourcolor-firmware/firmware
</code></pre>
<p>当前仓库文档使用 ESP-IDF 6.0 环境。启用 ESP-IDF 环境后编译固件：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">idf.py set-target esp32s3
idf.py menuconfig
idf.py build
idf.py -p /dev/cu.usbmodemXXXX flash monitor
</code></pre>
<p>请将 <code>/dev/cu.usbmodemXXXX</code> 替换为电脑实际识别到的串口。Windows 使用对应的 <code>COM</code> 端口。按 <code>Ctrl + ]</code> 退出串口监视器。</p>
<h3 id="选择-note4c-面板" class="toc-header"><a class="toc-anchor" href="#选择-note4c-面板">¶</a> 选择 NOTE4C 面板</h3>
<p>四色面板是仓库默认的 ZECTRIX 面板配置。在 <code>idf.py menuconfig</code> 中确认：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-text">ZecTrix EPD panel type
└── 4-color BWRY SSD2683 EPD
</code></pre>
<p>对应配置：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-text">CONFIG_ZECTRIX_EPD_PANEL_4COLOR_SSD2683=y
</code></pre>
<p>为 NOTE4C 编译时，请勿选择 1 bpp 黑白面板。</p>
<h3 id="仓库范围" class="toc-header"><a class="toc-anchor" href="#仓库范围">¶</a> 仓库范围</h3>
<p>该仓库是持续演进的参考项目，不是消费版 NOTE4 固件。目前包含固件 UI 和显示代码、AP 热点传图、可选 Python 服务器组件，以及图片 / 设备管理功能。启用外部服务、API、OTA 地址或自定义分区前，请先阅读仓库当前的 README 和源码。不要提交 <code>.env</code> 文件、API Key、Wi-Fi 凭据、编译产物、日志或本地数据库。</p>

<h2 id="支持边界" class="toc-header"><a class="toc-anchor" href="#支持边界">¶</a> 支持边界</h2>
<p>NOTE4C 是开发设备。第三方固件、自定义分区表、服务器部署、外部 API 服务和硬件改装由开发者自行负责。安装前请保留经过验证的 16 MB Flash 备份，并记录准确的固件文件名、写入地址和校验值。如果怀疑硬件故障，请联系 ZECTRIX 支持，并提供设备型号、PCB 版本、固件文件名、复现步骤和现象照片或视频。</p>
